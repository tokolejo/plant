<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col justify-center items-center overflow-hidden">
<!-- Background Image / Atmosphere -->
<div class="fixed inset-0 z-0 pointer-events-none w-full h-full opacity-30 mix-blend-multiply" data-alt="A minimalist, out-of-focus background depicting lush, premium Monstera and Ficus plants bathed in soft, diffused morning sunlight. The aesthetic is organic, calm, and high-end botanical. Light mode colors with soft greens and neutral warm whites. Depth of field is extremely shallow." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDNFyyhd87sVAph6_ZBhG_efH9nG587_jjgsbCBWGTTvl6YnLgnTP5ZO4bJoqJPfBglvMx6jjVKlQyxLRow4S2kogEjO3Rn9h5Oc2zvl4wBFRdcrkcJyZD3cbjUjtDamqOh54VcvNRjMLogMxACMrzj5GDWSD160lt8PohX2viyHGx6cHkM2lcB8xycMCWAgSpPxMdfttU_P7hfeqthWdPg5KncHLgMBLni6fdSIiwEOFHJfsv3uHoU')">
</div>
<!-- Modal Overlay Container -->
<div class="relative z-10 w-full max-w-lg mx-auto p-margin-mobile md:p-margin-desktop flex flex-col items-center animate-[fadeIn_0.3s_ease-out]">
<!-- Minimalist Exit Button -->
<button aria-label="Close" class="absolute top-margin-mobile right-margin-mobile md:top-margin-desktop md:right-margin-desktop w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest/80 backdrop-blur-md text-on-surface hover:bg-surface-container-high transition-colors shadow-[0px_4px_12px_rgba(0,0,0,0.02)] z-20">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<div class="w-full bg-surface-container-lowest/90 backdrop-blur-2xl rounded-[32px] p-8 md:p-12 shadow-[0px_20px_60px_rgba(0,0,0,0.06)] flex flex-col items-center text-center">
<div class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight mb-2">Add New Plant</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Snap a photo to let our AI identify your botanical.</p>
</div>
<!-- Large Glowing Upload Area -->
<button class="upload-area group relative w-full aspect-square max-w-[280px] rounded-[32px] bg-secondary-container/30 border-2 border-dashed border-primary-container/20 flex flex-col items-center justify-center mb-10 transition-all duration-300 hover:border-primary/40 hover:bg-secondary-container/50 focus:outline-none focus:ring-4 focus:ring-primary/20">
<div class="glow-effect absolute inset-0 rounded-[32px] transition-shadow duration-300 pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-primary">
<span class="material-symbols-outlined text-[64px] mb-4 font-light transition-transform duration-300 group-hover:scale-110 group-hover:-translate-y-2" style="font-variation-settings: 'wght' 200">add_a_photo</span>
<span class="font-title-md text-title-md">Tap to Upload</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-2">or drag and drop</span>
</div>
</button>
<!-- Actions -->
<div class="w-full flex flex-col items-center gap-4">
<button class="w-full py-4 px-6 bg-primary text-on-primary rounded-[20px] font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-lg active:scale-[0.98]">
<span class="text-2xl">🪄</span>
                    AI Auto-Detect
                </button>
<button class="mt-4 text-on-surface-variant hover:text-primary font-body-sm text-body-sm transition-colors underline-offset-4 hover:underline">
                    Enter details manually
                </button>
</div>
</div>

<!-- No Shared Navigation Components required as this is a linear/transactional flow (Modal Wizard) -->

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
