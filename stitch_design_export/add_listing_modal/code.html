<!-- Optional: Minimal JS for dropzone interaction visual feedback -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropzone = document.querySelector('.border-dashed');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, unhighlight, false);
            });

            function highlight(e) {
                dropzone.classList.add('border-primary-fixed-dim', 'bg-surface-container');
                dropzone.classList.remove('border-outline-variant', 'bg-surface-container-low');
            }

            function unhighlight(e) {
                dropzone.classList.remove('border-primary-fixed-dim', 'bg-surface-container');
                dropzone.classList.add('border-outline-variant', 'bg-surface-container-low');
            }
            
            dropzone.addEventListener('drop', handleDrop, false);
            
            function handleDrop(e) {
                let dt = e.dataTransfer;
                let files = dt.files;
                // Basic visual feedback for drop (in a real app, this would process the file)
                const icon = dropzone.querySelector('.material-symbols-outlined');
                icon.textContent = 'check_circle';
                icon.classList.remove('text-primary-container-forest');
                icon.classList.add('text-[#1b4d3e]'); // keeping theme color for check
                dropzone.querySelector('h3').textContent = 'Photo ready for scanning';
            }
        });
    </script>
